# ================================================================
# MCP (Model Context Protocol) 服务器声明式配置
# ================================================================
# 编辑此文件后，可在 Streamlit 侧边栏点击 "🔄 重载 MCP" 热加载，
# 或在代码中调用 registry.refresh() 重新加载。
#
# 环境变量替换语法：
#   ${VAR}              — 从 .env / 环境变量读取
#   ${VAR:-default}     — 带默认值（环境变量不存在时使用）
#
# 快速接入：选择下方模板，取消 enabled: false 注释，设置 API Key
# ================================================================

# ---- 全局设置 ----
settings:
  # 论文文件根目录（内置 filesystem server 使用）
  papers_base_dir: "./data"
  # 外部 MCP Server 连接超时（秒）
  connect_timeout: 60
  # 启动失败是否阻止应用启动（false = 降级运行）
  fail_fast: false

# ---- MCP 服务器定义 ----
servers:

  # ================================================================
  # [内置] 本地文件系统 — 开箱即用，零配置
  # ================================================================
  filesystem:
    enabled: true
    type: builtin
    description: "论文文件管理（列出/创建/移动/搜索/归类）"

  # ================================================================
  # [已启用] arXiv — 论文搜索、详情查看、全文下载
  # 开箱即用，无需额外配置
  # ================================================================
  arxiv:
    enabled: true
    type: stdio
    description: "arXiv 论文搜索与全文下载"
    command: C:\Users\30811\miniconda3\envs\demo\python.exe
    args: ["-m", "mcp_simple_arxiv"]


  
  # ================================================================
  # [模板] Brave Search — 联网搜索学术资料
  # 配置: .env 中设置 BRAVE_API_KEY，然后取消下方 enabled
  # 获取 API Key: https://brave.com/search/api/
